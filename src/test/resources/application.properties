# ===================================================================
# DATABASE CONNECTION (TESTING - IN-MEMORY H2)
# ===================================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:workshopsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH
spring.datasource.username=workshops_user
spring.datasource.password=oc2024

# ===================================================================
# JPA / HIBERNATE (TESTING)
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
